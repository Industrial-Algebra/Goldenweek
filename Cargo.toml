[package]
name = "goldenweek"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Thin GPU graphics abstraction — Metal and Vulkan render backends for Industrial Algebra"
license = "Apache-2.0"
repository = "https://github.com/industrial-algebra/Goldenweek"
keywords = ["gpu", "graphics", "rendering", "metal", "vulkan"]
categories = ["hardware-support", "rendering", "rendering::graphics-api"]

[features]
default = []
# Render backends land in v0.2. v0.1 ships the trait + opaque-handle surface
# plus a NoBackend stub, mirroring Borsalino's pre-backend state.
metal = []
vulkan = ["dep:ash", "dep:zunesha", "zunesha/vulkan"]

[dependencies]
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
# WGSL → MSL/SPIR-V translation. Load-bearing for the WGSL-first thesis;
# consumed by the render backends the moment they land.
naga = { version = "27", features = ["wgsl-in", "spv-out", "msl-out"] }

# Vulkan backend (Linux / Windows): raw FFI via ash, device via the shared
# Zunesha substrate. The backend borrows the Zunesha device (cloned handles) —
# it does not own it, since the device is shared with Borsalino (ADR 0001).
# Metal (macOS) lands later via objc.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = { version = "0.38", optional = true }
zunesha = { path = "../Zunesha", optional = true }

[dev-dependencies]
# GPU tests touch the Vulkan loader, which is not safe under concurrent
# instance/device creation (see Zunesha's serial-test note). `#[serial]`
# keeps Goldenweek's vulkan tests from racing the loader.
serial_test = "3"
